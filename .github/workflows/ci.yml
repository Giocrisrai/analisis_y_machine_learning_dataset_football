# Integración continua: lint, pruebas, pipeline Kedro y notebooks (SQLite mínimo).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KEDRO_DISABLE_TELEMETRY: "1"

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias (uv.lock)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Bootstrap SQLite mínimo
        run: uv run python scripts/bootstrap_data.py --source minimal --force

      - name: Ruff formato
        run: uv run ruff format --check src tests scripts

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Comprobar dependencias runtime
        run: uv run python scripts/check_runtime_deps.py

      - name: Pytest
        run: uv run python -m pytest tests/ -q --tb=short

      - name: Kedro run (pipeline por defecto)
        run: uv run python -m kedro run

  notebooks:
    name: Verificar notebooks
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Dependencias y datos mínimos
        run: |
          uv sync --locked --extra dev --python 3.11
          uv run python scripts/bootstrap_data.py --source minimal --force

      - name: Ejecutar notebooks (nbclient)
        run: uv run python scripts/verify_notebooks.py
